  <body>
    <button id="openUIBtn" class="hidden" onclick="toggleUI()">Settings</button>
    <div id="ui">
      <button id="closeUIBtn" onclick="toggleUI()">Close</button>
      <div class="section-title">Colors</div>
      <div class="input-wrapper">
        <label for="fontColor">Text color</label>
        <input type="color" id="fontColor" value="#ff0000">
      </div>
      <div class="input-wrapper">
        <label for="bgColor">Background color</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
      <div class="input-wrapper">
        <label for="shapeColor">Shape color</label>
        <input type="color" id="shapeColor" value="#000000">
      </div>
      <div class="section-title">Grid</div>
      <div class="input-wrapper">
        <label for="myNumberInputX">Columns</label>
        <input type="number" id="myNumberInputX" value="5" min="0" max="20" step="1">
      </div>
      <div class="input-wrapper">
        <label for="myNumberInputY">Rows</label>
        <input type="number" id="myNumberInputY" value="5" min="0" max="20" step="1">
      </div>
      <div class="section-title">Typography</div>
      <div class="input-wrapper">
        <label for="mySlider">Slider</label>
        <input type="range" id="mySlider" value="250" min="0" max="500">
      </div>
      <div class="input-wrapper">
        <label for="myText">Text</label>
        <input type="text" id="myText" value="Hello, World!">
      </div>
